<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AMR 로봇 관제 대시보드</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <!-- 상단 헤더 -->
        <header class="header">
            <div class="logo-area">
                <span class="robot-icon">🤖</span>
                <div>
                    <h1>AMR 로봇 관제 대시보드</h1>
                    <p class="subtitle">REST API 기반 자율주행 원격 제어 시스템</p>
                </div>
            </div>
            <div class="header-controls">
                <div id="statusBadge" class="status-badge idle">
                    <span class="pulse-dot"></span>
                    <span id="statusText">대기 중 (Idle)</span>
                </div>
                <button id="quickStopBtn" class="btn-emergency">
                    <span>🛑 긴급 정지 (STOP)</span>
                </button>
            </div>
        </header>

        <!-- 메인 그리드 -->
        <main class="main-grid">
            <!-- 좌측 컬럼: 웨이포인트 목록 -->
            <section class="card waypoints-section">
                <div class="card-header">
                    <h2>📍 등록된 장소 목록 (Waypoints)</h2>
                    <button id="refreshWpBtn" class="btn-icon" title="목록 새로고침">🔄</button>
                </div>
                <p class="card-desc">이동할 장소를 클릭하면 로봇이 해당 좌표로 즉시 자율주행을 시작합니다.</p>
                <div id="waypointsList" class="waypoints-list">
                    <div class="loading-state">장소 목록을 불러오는 중...</div>
                </div>
            </section>

            <!-- 우측 컬럼: 임의 좌표 이동 & 빠른 실행 -->
            <section class="card-column">
                <!-- 빠른 미션 실행 카드 -->
                <div class="card">
                    <div class="card-header">
                        <h2>⚡ 퀵 액션 (Quick Actions)</h2>
                    </div>
                    <div class="quick-grid">
                        <button id="quickHomeBtn" class="btn-action btn-home">
                            <span class="btn-icon-large">🏠</span>
                            <div class="btn-text-group">
                                <strong>홈 복귀</strong>
                                <small>Home Station 복귀 주행</small>
                            </div>
                        </button>
                        <button id="quickPatrolBtn" class="btn-action btn-patrol">
                            <span class="btn-icon-large">🔄</span>
                            <div class="btn-text-group">
                                <strong>전체 순찰</strong>
                                <small>등록된 전 지점 순차 주행</small>
                            </div>
                        </button>
                        <button id="quickRoundTripBtn" class="btn-action btn-test">
                            <span class="btn-icon-large">🧪</span>
                            <div class="btn-text-group">
                                <strong>왕복 주행 테스트</strong>
                                <small>1초 직진 후 180도 회전 복귀</small>
                            </div>
                        </button>
                    </div>
                </div>

                <!-- 직접 좌표 입력 주행 카드 -->
                <div class="card">
                    <div class="card-header">
                        <h2>📐 임의 좌표 주행 (Coordinate Nav)</h2>
                    </div>
                    <form id="coordsForm" class="coords-form">
                        <div class="form-row">
                            <div class="input-group">
                                <label for="coordX">X 좌표 (m)</label>
                                <input type="number" id="coordX" step="0.01" placeholder="예: 1.50" required>
                            </div>
                            <div class="input-group">
                                <label for="coordY">Y 좌표 (m)</label>
                                <input type="number" id="coordY" step="0.01" placeholder="예: -0.80" required>
                            </div>
                            <div class="input-group">
                                <label for="coordYaw">헤딩 각도 (°)</label>
                                <input type="number" id="coordYaw" step="1" value="0" placeholder="0">
                            </div>
                        </div>
                        <button type="submit" class="btn-primary">
                            <span>🚀 해당 좌표로 이동</span>
                        </button>
                    </form>
                </div>
            </section>
        </main>

        <!-- 하단 실시간 콘솔 로그 -->
        <footer class="card log-section">
            <div class="card-header">
                <h2>📋 로봇 주행 및 API 활동 로그</h2>
                <button id="clearLogBtn" class="btn-icon" title="로그 지우기">🗑️</button>
            </div>
            <div id="logBox" class="log-box"></div>
        </footer>
    </div>

    <script src="app.js"></script>
</body>
</html>
